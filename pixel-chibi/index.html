
<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Chibi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pixel Chibi</h1>
        <p>Crie seu próprio personagem pixel art!</p>
    </header>

    <main>
        <section id="criador">
            <h2>Meu personagem</h2>

         
<div id="personagem">
    Seu bonequinho aparecerá aqui.
</div>

<div id="opcoes">
    <button data-categoria="cabelos">Cabelos</button>
    <button data-categoria="olhos">Olhos</button>
    <button data-categoria="roupas">Roupas</button>
    <button data-categoria="acessorios">Acessórios</button>
</div>

<div id="painel-opcoes">
    <h3 id="titulo-opcoes">Escolha uma categoria</h3>
    <p id="descricao-opcoes">
        Clique em uma das opções acima para começar!
    </p>

        </section>
    </main>

    <script src="script.js"></script>
